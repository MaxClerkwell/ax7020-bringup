# URL of the image manifest. Empty means: do nothing, stay in the
# maintenance system. The manifest lists kernel, dtb and initrd with their
# sha256; the files are fetched relative to the manifest's URL.
#
#   IMAGE_URL="http://buildserver.example.com/ax7020/latest.manifest"
#   IMAGE_URL="https://cloud.example.com/s/TOKEN/download?files=latest.manifest"
#
IMAGE_URL=""

# Only consulted for https:// URLs, since certificate dates need a clock.
NTP_SERVER="pool.ntp.org"

# Kernel command line for the new system. Default: the running one.
#CMDLINE="console=ttyPS0,115200 ip=dhcp"
