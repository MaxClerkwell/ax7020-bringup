# Load U-Boot SPL + U-Boot proper over JTAG on a freshly powered board
# (boot-mode jumper on JTAG, BootROM parked both cores).
#
#   openocd -f openocd/ft232h.cfg -f target/zynq_7000.cfg -f openocd/load-uboot.cfg
#
# Lessons learned:
#  * Always select zynq.cpu0 explicitly. "resume <addr>" only sets PC on the
#    *current* target, and after a halt that is often cpu1.
#  * Load U-Boot proper into DDR only while SPL is halted: SPL runs with
#    caches off, so the JTAG writes land in DRAM. Loading while a previous
#    U-Boot (MMU + D-cache on) is halted leaves stale cache lines and corrupts
#    the image in 32-byte chunks.
#  * Never write PSS_RST_CTRL (0xF8000200) from JTAG: it also resets the
#    debug logic and cpu0 becomes unhaltable until a power cycle.
#  * In JTAG boot mode SPL looks for a payload at 0x10000000 and, finding
#    none, jumps into uninitialised DDR -> undefined instruction at 0x40.
#    That is expected; we halt it and hand over U-Boot proper ourselves.

set SPL   build/ax7020/uboot/u-boot/spl/u-boot-spl.bin
set UBOOT build/ax7020/uboot/u-boot/u-boot.bin

init
targets zynq.cpu0
halt

echo "== Stage 1: SPL into OCM (ps7_init: PLL, MIO, DDR) =="
load_image $SPL 0x0 bin
reg pc 0x0
resume
sleep 3000
halt
targets zynq.cpu0

echo "== DDR sanity: write/read at the top of 1 GiB =="
mww 0x3ffffffc 0xcafebabe
mdw 0x3ffffffc 1

echo "== Stage 2: U-Boot proper into DDR =="
load_image $UBOOT 0x4000000 bin
verify_image $UBOOT 0x4000000 bin
reg pc 0x4000000
resume
echo "== U-Boot running. Netconsole: nc -u -l 6666 =="
