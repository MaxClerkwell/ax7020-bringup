#@TYPE: Machine
#@NAME: ax7020
#@DESCRIPTION: Alinx AX7020 (Zynq-7000, XC7Z020-2CLG400, 1 GiB DDR3, 32 MiB QSPI)
#
# Everything Linux needs ships as ONE artifact: a FIT image holding kernel,
# device tree and an initramfs, written to QSPI at 0xE80000. The root
# filesystem therefore lives in RAM - the board has 1 GiB, the flash 32 MiB.
#
# The board has no serial console in this setup: U-Boot talks over netconsole,
# Linux over the netconsole module plus dropbear. See the top-level README.

require conf/machine/zynq-generic.conf

# Our own device tree, added by recipes-kernel/linux/linux-xlnx_%.bbappend
KERNEL_DEVICETREE = "xilinx/zynq-ax7020.dtb"

# One FIT with kernel + DTB + ramdisk. kernel-fitimage replaces the default
# kernel-uimage class; INITRAMFS_IMAGE_BUNDLE stays 0 so the initramfs becomes
# its own section in the FIT rather than being linked into the kernel.
KERNEL_IMAGETYPE = "fitImage"
KERNEL_CLASSES = "kernel-fitimage"
INITRAMFS_IMAGE = "ax7020-initramfs"
INITRAMFS_IMAGE_BUNDLE = "0"

UBOOT_ENTRYPOINT  = "0x200000"
UBOOT_LOADADDRESS = "0x200000"

# U-Boot is built from mainline outside Yocto and already lives in QSPI
# (see uboot/ and the README). Yocto must not build or stage a bootloader.
PREFERRED_PROVIDER_virtual/bootloader = ""
EXTRA_IMAGEDEPENDS = ""
UBOOT_BOOT_SCRIPT = ""
IMAGE_BOOT_FILES = ""

# No SD card image is produced; the FIT is written straight to flash.
IMAGE_FSTYPES = "cpio.gz"

MACHINE_FEATURES += "ext4"
