# AX7020: what this board needs, and not much else.
# Merged on top of xilinx_zynq_defconfig (KCONFIG_MODE = alldefconfig).

# --- FPGA manager: the point of the whole exercise -------------------------
# Gives /sys/class/fpga_manager/fpga0/ and, with the fpga-region node from
# zynq-7000.dtsi, bitstream loading from userspace.
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y
CONFIG_OF_OVERLAY=y

# --- sysfs / devtmpfs -----------------------------------------------------
CONFIG_SYSFS=y
CONFIG_PROC_FS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# --- initramfs as the root filesystem -------------------------------------
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y

# --- kernel log over the network (no serial cable on this board) ----------
CONFIG_NETCONSOLE=y
CONFIG_NETCONSOLE_DYNAMIC=y

# --- QSPI flash so userspace can rewrite the boot chain -------------------
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_MTD_BLOCK=y
CONFIG_SPI_ZYNQ_QSPI=y

# --- trim: none of this exists on the board or is wanted in 32 MiB --------
# CONFIG_DRM is not set
# CONFIG_FB is not set
# CONFIG_SOUND is not set
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_WLAN is not set
# CONFIG_WIRELESS is not set
# CONFIG_BT is not set
# CONFIG_CAN is not set
# CONFIG_INFINIBAND is not set
# CONFIG_NFS_FS is not set
# CONFIG_BTRFS_FS is not set
# CONFIG_XFS_FS is not set
# CONFIG_IPV6 is not set

# --- kexec: neue Images starten, ohne den Flash anzufassen -----------------
CONFIG_KEXEC=y
